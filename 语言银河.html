<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>语言银河 · 点亮</title>
<style>
  :root{
    --ink:#dfe9ff; --dim:#7e8bb0; --glass:rgba(14,20,40,.55);
    --line:rgba(120,160,255,.25);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:radial-gradient(ellipse at 50% 38%, #0b1430 0%, #060a18 42%, #020308 100%);overflow:hidden;
    font-family:"PingFang SC","Microsoft YaHei",-apple-system,system-ui,sans-serif;
    color:var(--ink);cursor:grab;}
  body.drag{cursor:grabbing}
  #scene{position:fixed;inset:0;display:block}
  /* 词标签 */
  #labels{position:fixed;inset:0;pointer-events:none}
  .lab{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;
    font-size:13px;letter-spacing:.5px;white-space:nowrap;
    color:rgba(223,233,255,.82);
    text-shadow:0 0 8px rgba(120,170,255,.7),
      0 1px 3px rgba(0,0,0,.98),0 -1px 3px rgba(0,0,0,.98),
      1px 0 3px rgba(0,0,0,.98),-1px 0 3px rgba(0,0,0,.98);
    transition:color .2s,text-shadow .2s,font-size .2s;user-select:none}
  .lab:hover,.lab.on{color:#fff;font-size:17px;font-weight:600;
    text-shadow:0 0 18px rgba(180,215,255,1),0 0 6px rgba(255,255,255,1),0 0 28px rgba(120,180,255,.95)}
  /* 顶部提示 */
  #hint{position:fixed;top:18px;left:50%;transform:translateX(-50%);
    font-size:12.5px;color:var(--dim);letter-spacing:1px;text-align:center;
    text-shadow:0 0 10px rgba(0,0,0,.8);pointer-events:none}
  #hint b{color:#a9c4ff;font-weight:600}
  /* 标题 */
  #title{position:fixed;top:16px;left:20px;font-size:15px;letter-spacing:3px;
    color:#bcd2ff;text-shadow:0 0 16px rgba(120,170,255,.6)}
  #title small{display:block;font-size:10px;letter-spacing:2px;color:var(--dim);margin-top:3px}
  /* 详情面板 */
  /* 卡片移到左上角（标题下方）：视线区完整留给星星，不再压住焦点 */
  #panel{position:fixed;top:64px;left:20px;transform:translateX(-18px);
    width:286px;padding:20px 20px 18px;background:rgba(11,17,36,.46);
    border:1px solid rgba(140,180,255,.24);border-radius:16px;
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    box-shadow:0 0 40px rgba(60,110,255,.14),inset 0 0 30px rgba(80,140,255,.05);
    opacity:0;pointer-events:none;transition:opacity .35s,transform .35s}
  #panel.show{opacity:1;pointer-events:auto;transform:translateX(0)}
  #panel .fam{font-size:11px;letter-spacing:2px;color:#8fb0ff;margin-bottom:10px}
  #panel .word{font-size:30px;font-weight:600;letter-spacing:.5px;
    text-shadow:0 0 22px rgba(150,200,255,.6)}
  #panel .ph{font-size:13px;color:#9fb6e6;margin:4px 0 14px;font-style:italic}
  #panel .cn{font-size:15px;line-height:1.6;color:#e8eeff;margin-bottom:14px}
  #panel .meta{font-size:11.5px;color:var(--dim);line-height:1.7;
    border-top:1px solid rgba(140,180,255,.16);padding-top:12px}
  #panel .meta b{color:#bcd2ff;font-weight:600}
  /* 学习层：同根词族成员列表——点中一词，顺着词根游览同族 */
  #panel .famlist{display:none;margin-top:14px;padding-top:12px;border-top:1px solid rgba(140,180,255,.16);flex-wrap:wrap;gap:6px}
  #panel .famlist.show{display:flex}
  #panel .famlist .ttl{width:100%;font-size:11px;letter-spacing:1px;color:#8fb0ff;margin-bottom:5px;user-select:none}
  #panel .famchips{display:flex;flex-wrap:wrap;gap:6px;width:100%}
  #panel .chip{font-size:12px;padding:3px 9px;border-radius:20px;border:1px solid rgba(140,180,255,.3);color:#cfe0ff;cursor:pointer;transition:.2s;user-select:none}
  #panel .chip:hover{background:rgba(140,180,255,.18);color:#fff;border-color:#fff}
  #panel .more{font-size:11px;color:var(--dim);align-self:center;padding-left:4px}
  #panel .close{position:absolute;top:14px;right:16px;width:22px;height:22px;
    border-radius:50%;border:1px solid rgba(140,180,255,.3);color:#9fb6e6;
    font-size:13px;line-height:20px;text-align:center;cursor:pointer;
    transition:.2s}
  #panel .close:hover{color:#fff;border-color:#fff;background:rgba(140,180,255,.15)}
  /* 近邻模式：选中后整屏只呈现这颗星与它的真实近邻（单词才看得清，手机尤其如此） */
  #focus{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;
    box-shadow:inset 0 0 140px rgba(60,110,255,.13)}
  #focus.show{opacity:1}
  /* 天区坐标常驻：地图的经纬度 = 星图的赤经赤纬，回答"我在哪一片天区" */
  #coord{position:fixed;top:18px;right:20px;font-size:11px;letter-spacing:1.2px;
    color:var(--dim);text-shadow:0 0 10px rgba(0,0,0,.85);pointer-events:none;
    font-variant-numeric:tabular-nums;z-index:3}
  #focus::after{content:attr(data-tip);position:absolute;
    left:50%;bottom:24px;transform:translateX(-50%);white-space:nowrap;
    font-size:11.5px;letter-spacing:1px;color:var(--dim);
    text-shadow:0 0 10px rgba(0,0,0,.85)}
  /* 近邻模式下字号放大到可读 */
  #labels.closeup .lab{font-size:21px}
  #labels.closeup .lab.on{font-size:25px}
  @media (max-width:640px){
    #labels.closeup .lab{font-size:26px}
    #labels.closeup .lab.on{font-size:30px}
    #panel{left:12px;right:12px;top:auto;bottom:12px;width:auto;
      transform:translateY(20px);padding:16px 16px 14px}
    #panel.show{transform:translateY(0)}
    #panel .word{font-size:26px}
    #legend{display:none}
    #focus::after{font-size:10.5px;bottom:16px}
  }
  /* 图例 */
  #legend{position:fixed;bottom:18px;left:20px;font-size:11px;color:var(--dim);
    line-height:1.9;max-width:260px}
  #legend .row{display:flex;align-items:center;gap:8px}
  #legend .dot{width:8px;height:8px;border-radius:50%;flex:none;
    box-shadow:0 0 8px currentColor}
  #legend b{color:#a9c4ff;font-weight:500}
  /* 数据来源 / 关于 */
  #aboutBtn{position:fixed;bottom:18px;right:20px;font-size:11px;letter-spacing:1px;
    color:var(--dim);border:1px solid rgba(140,180,255,.25);border-radius:20px;
    padding:6px 13px;cursor:pointer;background:rgba(14,20,40,.4);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:.2s;user-select:none}
  #aboutBtn:hover{color:#cfe0ff;border-color:rgba(140,180,255,.5)}
  /* 手气不错：随机漂流入口（PRD §4.9）。随机不是推荐——它不猜你想去哪，只把骰子递给你 */
  #luckyBtn{position:fixed;bottom:18px;right:132px;font-size:11px;letter-spacing:1px;
    color:var(--dim);border:1px solid rgba(140,180,255,.25);border-radius:20px;
    padding:6px 13px;cursor:pointer;background:rgba(14,20,40,.4);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:.2s;user-select:none}
  #luckyBtn:hover{color:#ffe9b8;border-color:rgba(255,214,140,.5);text-shadow:0 0 12px rgba(255,220,150,.6)}
  #about{position:fixed;bottom:58px;right:20px;width:284px;padding:18px 18px 16px;
    background:var(--glass);border:1px solid rgba(140,180,255,.28);border-radius:16px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 0 30px rgba(60,110,255,.18);opacity:0;pointer-events:none;
    transform:translateY(10px);transition:.3s;z-index:5}
  #about.show{opacity:1;pointer-events:auto;transform:translateY(0)}
  #about .hd{font-size:14px;letter-spacing:2px;color:#bcd2ff;margin-bottom:6px}
  #about .sub{font-size:11px;color:var(--dim);line-height:1.5;margin-bottom:14px}
  #about .src{font-size:11.5px;color:#cdd9f5;line-height:2}
  #about .src b{color:#8fb0ff;font-weight:600;display:inline-block;width:64px}
  #about .src span{color:#9fb6e6}
  #about .close{position:absolute;top:12px;right:14px;width:20px;height:20px;border-radius:50%;
    border:1px solid rgba(140,180,255,.3);color:#9fb6e6;font-size:12px;line-height:18px;
    text-align:center;cursor:pointer;transition:.2s}
  #about .close:hover{color:#fff;border-color:#fff;background:rgba(140,180,255,.15)}
</style>
</head>

function buildFamRing(con){
  const pts=wordStars.filter(s=>s.con===con).map(s=>s.pos.clone());
  if(pts.length<3){ famGeo.setFromPoints(pts.length?pts.concat([pts[0]]):[]); return; }
  const c=new THREE.Vector3(); pts.forEach(p=>c.add(p)); c.multiplyScalar(1/pts.length);
  const n=c.clone().normalize(), ref=pts[0].clone().sub(c);
  pts.sort((a,b)=>Math.atan2(n.dot(a.clone().sub(c).cross(ref)),a.clone().sub(c).dot(ref))
                 -Math.atan2(n.dot(b.clone().sub(c).cross(ref)),b.clone().sub(c).dot(ref)));
  famGeo.setFromPoints(pts.concat([pts[0]]));
}

  const st=wordStars[i];
  // 不转相机：转了头晕。被点中的星本来就来自屏幕可见处，它就在眼前。
  // 取真实天球上角距最近的 6 颗 = 相邻最密的那几颗，它们就是"下一步"
  // 邻居 = 语言学上的相邻：同词族（同根）优先。同族本就聚在同一片天区，所以位置近=同根。
  // 公理层没有词根，退回银河里的几何近邻（PRD：公理层不可分析，不做探索）
  const a=U[i], myCon=STARS[i][5], same=[], other=[];
  for(let j=0;j<wordStars.length;j++){
    if(j===i) continue;
    const d=a.dot(U[j]);
    if(myCon!=='mw' && wordStars[j].con===myCon) same.push([d,j]);
    else other.push([d,j]);
  }
  same.sort((x,y)=>y[0]-x[0]); other.sort((x,y)=>y[0]-x[0]);
  const arr=same.concat(other);
  selNei=arr.slice(0,6).map(o=>o[1]); selNeiSet=new Set(selNei);
  // fitBounds：记下最远近邻的真实角距，视野据此自适应（近邻始终舒适地落在屏内）
  selFit=Math.acos(Math.max(-1,Math.min(1,arr[5][0])))*180/Math.PI;
  // 特写视角对准这颗星；每次跳转都恢复自动视野（重新 fit，保证这一步看得清）
  const pn=wordStars[i].pos.clone().normalize();
  focusPh=Math.acos(Math.max(-1,Math.min(1,pn.y)));
  focusTh=Math.atan2(pn.z,pn.x);
  focusFov=0;
  neiGeo.setFromPoints(selNei.reduce((p,j)=>(p.push(st.pos,wordStars[j].pos),p),[]));
  const d=LINGO_WORDS[st.word]||{};
  document.getElementById('pFam').textContent = FAM[st.con].cn+' · '+st.fam;
  document.getElementById('pWord').textContent = st.word;
  const ph=(d.ph&&d.ph.length>2)?d.ph:'';
  document.getElementById('pPh').textContent = ph?('/'+ph+'/'):'';
  document.getElementById('pCn').textContent = d.cn||'（暂无释义）';
  const fq=d.frq?('#'+d.frq):'—';
  document.getElementById('pMeta').innerHTML =
    '星座：<b>'+FAM[st.con].cn+'</b><br>词族：<b>'+st.fam+'</b>'+
    '<br>词频排名：<b>'+fq+'</b>（越小越常用）<br>星等：<b>'+STARS[i][3]+'</b>';
  document.getElementById('panel').classList.add('show');
  focusBox.dataset.tip = (STARS[i][5]==='mw')
    ? '银河近邻 · 点亮的词可继续跳转　✕ 返回全景'
    : '同根词族 · 点亮的词可继续跳转　✕ 返回全景';
  focusBox.classList.add('show'); labelsBox.classList.add('closeup');
  wordStars.forEach((s,k)=>s.lab.classList.toggle('on',k===i));
  // 小烂漫：I 即地球——卡片不放释义，只放这句话
  if(st.word==='i'){
    document.getElementById('pFam').textContent='🜨 地球 · 观察者自身';
    document.getElementById('pWord').textContent='I';
    document.getElementById('pPh').textContent='';
    document.getElementById('pCn').textContent='你。天球的中心是你脚下的地球——整片银河，都是你抬眼所见的语言星河。它是「我」，所有词皆由这个「我」说出。';
    document.getElementById('pMeta').innerHTML='星座：<b>公理层 · 银河带</b><br>身份：<b>观察者 / 自我</b><br>词频：<b>最高频</b><br>星等：<b>'+STARS[i][3]+'</b>';
    focusBox.dataset.tip='你即地球 · 点亮的词可继续跳转　✕ 返回全景';
  }
  // 学习层：同根词族成员列表——点中一词，顺着词根游览同族（闭环）
  const fl=document.getElementById('pFamList');
  if(st.con==='mw'){ fl.classList.remove('show'); fl.innerHTML=''; }
  else {
    const mem=wordStars.map((s,k)=>({w:s.word,k})).filter(o=>o.k!==i && wordStars[o.k].con===st.con)
      .sort((a,b)=>_frqOf(a.w)-_frqOf(b.w));
    // 光环可见但折叠（PRD：点开才展开）——先给你这圈的名字，想逛再打开
    fl.innerHTML='<div class="ttl" id="famToggle" style="cursor:pointer">词源光环 · '+mem.length+' 个同根词 ▸ 点开</div>'+
      '<div class="famchips" style="display:none">'+mem.slice(0,18).map(o=>'<span class="chip" data-i="'+o.k+'">'+o.w+'</span>').join('')+
      (mem.length>18?'<span class="more">+'+(mem.length-18)+' 个</span>':'')+'</div>';
    fl.classList.add('show');
    const tg=document.getElementById('famToggle'), chipsBox=fl.querySelector('.famchips');
    tg.addEventListener('click',()=>{
      const open=chipsBox.style.display!=='none';
      chipsBox.style.display=open?'none':'flex';
      tg.textContent='词源光环 · '+mem.length+' 个同根词 '+(open?'▸ 点开':'▾ 收起');
    });
    fl.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>select(+c.dataset.i)));
  }
  // 词源光环：同根词族在星图上连成一圈淡色光环
  if(st.con!=='mw'){ buildFamRing(st.con); famRing.material.color.set(FAMCOL[st.con]||0xffffff); }
  else { famGeo.setFromPoints([]); }
}
// ---------- 图例（按「层 + 真实词源色系」，不逐条列举词族） ----------
(function legend(){
  const box=document.getElementById('legend');
  const dot=c=>'<span class="dot" style="color:#'+c.toString(16).padStart(6,'0')+
    ';background:#'+c.toString(16).padStart(6,'0')+'"></span>';
  const famN=Object.keys(FAM).filter(c=>c!=='mw').length;
  let h='';
  h+='<div class="row">'+dot(FAMCOL.mw||0xfff1d6)+'<b>公理层</b> · 银河带（不可分析）</div>';
  h+='<div class="row"><b>定理层</b> · 深空 '+famN+' 个词族（可分析）</div>';
  [['Latin',0xffd27f],['Greek',0x6fd3ff],['Old English',0x9fffcf]].forEach(o=>{
    h+='<div class="row">'+dot(o[1])+o[0]+'</div>';
  });
  box.innerHTML=h;
})();

// ---------- 数据来源面板 ----------
(function about(){
  const btn=document.getElementById('aboutBtn');
  const el=document.getElementById('about');
  btn.addEventListener('click',()=>el.classList.toggle('show'));
  document.getElementById('aClose').addEventListener('click',()=>el.classList.remove('show'));
})();

// 手气不错：随机漂流（PRD §4.9）。落在哪片天全凭运气，系统不猜你想去哪、也不给建议
(function lucky(){
  document.getElementById('luckyBtn').addEventListener('click',()=>{
    let i; do{ i=Math.floor(Math.random()*wordStars.length); }while(i===sel && wordStars.length>1);
    select(i);
  });
})();

// 常显标签：真实词频最高的 80 个（"你住在银河里"的路标），其余靠悬停/选中显现
const _frqOf=w=>{const d=(typeof LINGO_WORDS!=='undefined')?(LINGO_WORDS[w]||{}):{};return parseInt(d.frq,10)||9e9;};
const ALWAYS=new Set(STARS.map((s,i)=>({w:s[6],i})).sort((a,b)=>_frqOf(a.w)-_frqOf(b.w)).slice(0,80).map(o=>o.i));
if(earthIdx>=0) ALWAYS.add(earthIdx);   // 地球恒显：你始终在星河里

// ---------- 渲染循环 ----------
let t0=performance.now(), frameN=0;
function tick(){
  const el=(performance.now()-t0)/1000;
  const gfade=Math.min(1, el/2.4);
  // 近邻模式下压暗星海背景：焦点与近邻浮出，其余退为背景
  fadeItems.forEach(o=>o.mat.opacity=o.base*gfade*(sel>=0?0.45:1));
  if(earthGlow) earthGlow.material.opacity=0.3+0.18*Math.sin(el*1.4);
  // 空闲慢漂移（如听星际穿越般悬浮）
  if(sel<0 && performance.now()-lastInteract>3500) camT.th += 0.0006;
  // 相机缓动
  cam.r+=(camT.r-cam.r)*0.07; cam.th+=(camT.th-cam.th)*0.07; cam.ph+=(camT.ph-cam.ph)*0.07;
  applyCam();
  // 近邻模式：先定好特写相机与视野（星点大小依赖 selView，必须算在前面）
  let camNow=camera, selView=0;
  if(sel>=0){
    const asp=innerWidth/innerHeight, need=selFit*1.5;
    let fov=(asp>=1)?2*need:2*Math.atan(Math.tan(need*Math.PI/180)/asp)*180/Math.PI;
    if(focusFov>0) fov=focusFov;                       // 用户手动缩放过就用他的
    else focusFov=0;
    camFocus.fov=Math.max(8, Math.min(75, fov));
    camFocus.aspect=asp; camFocus.updateProjectionMatrix();
    camFocus.position.set(0,0,0);
    camFocus.lookAt(FOCUS_T.set(
      Math.sin(focusPh)*Math.cos(focusTh),
      Math.cos(focusPh),
      Math.sin(focusPh)*Math.sin(focusTh)
    ).multiplyScalar(R));
    camFocus.updateMatrixWorld();
    camNow=camFocus;
    selView=2*R*Math.tan(camFocus.fov*Math.PI/360);    // 该视野对应的世界高度
  }
  // 星点：开场按亮度依次点亮 + 微闪 + 选中/悬停放大 + 同族高亮
  const selCon = sel>=0?wordStars[sel].con:null;
  const famT=(sel>=0 && selCon!=='mw')?0.5:0;
  famRing.material.opacity += (famT-famRing.material.opacity)*0.12;
  const pulse=0.5+0.5*Math.sin(el*3.2);
  wordStars.forEach((s,i)=>{
    let k=1;
    if(i===hov) k*=1.22;
    if(sel>=0){
      // 焦点最大 / 真实近邻亮起（可跳过去）/ 其余主动让位，否则密星海会盖住焦点
      // 按屏幕占比反推放大倍数：永远看得清，又不会大到糊成一团（星等差异仍保留）
      const sn=Math.max(0,Math.min(1,(s.base-9)/31));
      if(i===sel) k=(selView*(0.24+0.12*sn))/(s.base*2.1)*(1+0.12*Math.sin(el*3.2));
      else if(selNeiSet.has(i)) k=(selView*(0.10+0.06*sn))/(s.base*2.1);
      else if(selCon && s.con===selCon) k=1.25;
      else k=0.75;
    }
    s.scale += (k - s.scale)*0.15;
    const fin=Math.min(1, Math.max(0,(el-s.t0)/0.9));
    const tw=0.82+0.18*Math.sin(el*s.twsp+s.tw);
    const b=s.base*s.scale*fin;
    s.glow.scale.set(b*2.1,b*2.1,1);
    s.core.scale.set(b*0.7,b*0.7,1);
    let op=0.9*s.lum*fin*tw;
    if(sel>=0){
      if(i===sel) op=Math.min(1, op*1.5+0.35);
      else if(selNeiSet.has(i)) op=Math.min(1, op*1.7);
      else if(selCon && s.con===selCon) op*=1.2;
      else op*=0.3;
    }
    s.glow.material.opacity=op;
    s.core.material.opacity=0.95*fin*tw;
  });
  // 定位环 + 近邻连线
  if(sel>=0){
    const st=wordStars[sel];
    selRing.position.copy(st.pos);
    const rs=st.base*(11.0+2.4*pulse);
    selRing.scale.set(rs,rs,1);
    selRing.material.color.setHex(FAMCOL[st.con]||0xffffff);
    selRing.material.opacity=0.4+0.5*pulse;
    neiLine.material.opacity += (0.55 - neiLine.material.opacity)*0.15;
  } else {
    selRing.material.opacity=0;
    neiLine.material.opacity += (0 - neiLine.material.opacity)*0.15;
  }
  // 连线高亮
  allLines.forEach(l=>{
    const base=(selCon && l.userData.con===selCon)?0.95:0.22;
    l.material.opacity += (base*gfade - l.material.opacity)*0.1;
  });
  // 标签投影：默认只露最高频的一小批，其余在悬停/选中时显现（宏观拥挤、点开空旷）
  const W=innerWidth,H=innerHeight;
  // 1) 收集候选（只收在屏幕内的）
  const cands=[];
  wordStars.forEach((s,i)=>{
    // 全景只露最高频路标；近邻模式只露这颗星与它的真实近邻
    const vis = (sel>=0) ? (i===sel || selNeiSet.has(i)) : (ALWAYS.has(i) || i===hov);
    if(!vis){ if(s.lab.style.display!=='none') s.lab.style.display='none'; return; }
    const v=s.pos.clone().project(camNow);
    if(v.z>1){ s.lab.style.display='none'; return; }
    cands.push({i,s,v});
  });
  // 2) 优先级：选中 > 悬停 > 近邻 > 真实词频（越常用的词越先占位）
  cands.sort((a,b)=>{
    const pr=o=>(o.i===sel?0:o.i===hov?1:selNeiSet.has(o.i)?2:3);
    const d=pr(a)-pr(b);
    return d?d:(_frqOf(a.s.word)-_frqOf(b.s.word));
  });
  // 3) 像地图 POI 一样避让放置：挤不下就让位，密集区自然只留最重要的
  const FS=(sel>=0)?21:13, placed=[];
  for(const c of cands){
    const dist=camNow.position.distanceTo(c.s.pos);
    const sc=(sel>=0) ? 1.25 : Math.max(.62, Math.min(1.35, 230/dist));
    // 特写里标签落在星下方，避免文字压在星点上读不清
    const x=(c.v.x*0.5+0.5)*W, y=(-c.v.y*0.5+0.5)*H+((sel>=0)?26*sc:0);
    const w=c.s.word.length*FS*0.58*sc+12, h=FS*1.55*sc;
    let clash=false;
    for(const p of placed){
      if(Math.abs(x-p.x)<(w+p.w)*0.5 && Math.abs(y-p.y)<(h+p.h)*0.55){ clash=true; break; }
    }
    if(clash){ c.s.lab.style.display='none'; continue; }
    placed.push({x,y,w,h});
    c.s.lab.style.display='block';
    c.s.lab.style.transform=`translate(-50%,-50%) translate(${x}px,${y}px) scale(${sc})`;
  }
  renderer.setViewport(0,0,innerWidth,innerHeight);
  renderer.render(scene, (sel>=0)?camFocus:camera);   // 选中=全屏近邻模式，否则银河全景
  // 天区坐标常驻：全景=视线中心所在天区，近邻模式=这颗星所在天区
  if((frameN=(frameN+1)%8)===0){
    const d=(sel>=0) ? wordStars[sel].pos : camera.position.clone().negate();
    const u2=(d.lengthSq()?d:new THREE.Vector3(0,0,-1)).normalize();
    const dec=Math.asin(Math.max(-1,Math.min(1,u2.y)))*180/Math.PI;
    let ra=Math.atan2(u2.z,u2.x)*12/Math.PI; if(ra<0)ra+=24;
    let c='天区 RA '+ra.toFixed(1)+'h · Dec '+(dec>=0?'+':'')+dec.toFixed(0)+'°';
    if(sel>=0){
      c+=' · 跳 '+hops;
      if(wordStars[sel].con!=='mw'){ const rt=wordStars[sel].fam.split(' ')[0]; if(rt) c+=' · ↑'+rt; }
    }
    coordBox.textContent=c;
  }
  requestAnimationFrame(tick);
}
tick();

addEventListener('resize',()=>{
  renderer.setSize(innerWidth,innerHeight);
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
});
</script>
